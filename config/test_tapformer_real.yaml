# Paths are relative to the Track-On2 repository root.
dataset_root: ../TAPFormer/data/TAPFormer_Dataset
model_config: config/test.yaml
# checkpoint: checkpoints/trackon2_dinov3_checkpoint.pt
checkpoint: outputs/trackon2_kubric_panning/20260925_170703/best.pt
output_dir: outputs/real_tapformer_trackon2_0925_1
csv_filename: summary.csv

# Matches the available sequences in TAPFormer's InivTAP/DrivTAP evaluation.
sequences:
  InivTAP:
    - ID_Fast_Fruit
    - ID_Dark_Fruit
    - ID_OverExp_Fruit
    - ID_OverExp_Fruit2
    - ID_Dynamic_Robot
    - OD_Dynamic
    - OD_Static
    - OD_Basketball
  DrivTAP:
    - Day_Tunnel
    - Day_Bridge
    - Day_Fast
    - Night_Road
    - Night_Fast

drivtap_gt_mode: downsample_even
support_grid_size: 20
device: auto
amp: true
save_predictions: false

visualization:
  enabled: true
  format: mp4          # H.264; change to webm for VP8 if VS Code still cannot play MP4
  fps: 10
  trail_length: 8
  max_width: 960       # Width of each GT/prediction panel
