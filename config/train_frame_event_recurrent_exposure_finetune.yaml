# Fine-tune recurrent from best.pt with 70% original data and 30% exposure data.
# Original sources retain their relative weights; exposure totals 15% / 12% / 3%.
event_kubric_root: data/event_kubric
event_kubric_sources:
  - {name: train_batch, weight: 16.8, val_fraction: 0.1}
  - {name: train_seq, weight: 16.8, val_fraction: 0.1}
  - {name: train_batch_panning, weight: 11.2, val_fraction: 0.1}
  - {name: train_seq_panning, weight: 11.2, val_fraction: 0.1}
  - {name: fast_batch, weight: 4.2, val_fraction: 0.1}
  - {name: fast_seq, weight: 4.2, val_fraction: 0.1}
  - {name: fast_batch_panning, weight: 2.8, val_fraction: 0.1}
  - {name: fast_seq_panning, weight: 2.8, val_fraction: 0.1}
  - {name: sup_exposure, weight: 15, val_fraction: 0.1}
  - {name: sup_panning_exposure, weight: 12, val_fraction: 0.1}
  - {name: sup_fast_panning_exposure, weight: 3, val_fraction: 0.1}
split_seed: 1234
samples_per_epoch: 9024
# Load model weights only; start a new optimizer and schedule without --resume.
checkpoint_path: outputs/frame_event_recurrent/20261019_195720/best.pt
train_event_only: false
output_dir: outputs/frame_event_recurrent_exposure_finetune

input_size: [384, 512]
T: 24
N: 192
val_points: 128
frame_interval: 4
spatial_augmentation: true
spatial_scale_range: [1.0, 1.2]
# Training samples across the full sequence, starting at actual RGB anchors.
# Validation does the same with fixed per-sequence randomness; 0 restores prefix clips.
eval_start: null
bs: 1
num_workers: 8
val_num_workers: 4

M: 24
D: 256
K: 16
decoder_layer_num: 3
predicton_head_layer_num: 3
rerank_layer_num: 3
vit_backbone: dinov3_s_plus
vit_pretrained_path: checkpoints/dinov3_hf/vits16plus_lvd1689m
vit_upsample_factor: 1.143
grad_checkpoint: true
event_channels: 10
event_fusion_type: recurrent
event_encoder: etap
event_pretrained_path: checkpoints/ETAP_v1_cvpr25.pth

lambda_patch_cls: 3.0
delta_v: 0.8
# 6 GPUs x batch 1 x accumulation 4 = effective batch 24.
# 9,024 samples / 24 = 376 updates per epoch; 8 epochs = 3,008 updates.
epoch_num: 8
grad_accum_steps: 4
warmup_ratio: 0.01  # 30 successful updates on six GPUs, followed by cosine decay.
save_every: 2
overfit_steps: 100
log_every: 20
lr: 0.00005
wd: 0.00001
amp: true
seed: 1234
