# Train only the history scorer; freeze the RGB panning tracker and its running statistics.
# Load weights only. checkpoint_path / --resume restores a complete new-run checkpoint.
init_checkpoint_path: outputs/trackon2_kubric_panning/20261009_204126/best.pt
checkpoint_path: null
model_save_path: outputs/trackon2_trajectory_history_finetune

# Match the baseline's four sources and deterministic held-out split.
event_kubric_sources:
  - {name: train_batch, weight: 30, val_fraction: 0.1}
  - {name: train_seq, weight: 30, val_fraction: 0.1}
  - {name: train_batch_panning, weight: 20, val_fraction: 0.1}
  - {name: train_seq_panning, weight: 20, val_fraction: 0.1}
train_dataset: event_kubric_rgb
eval_dataset: kubric
movi_f_root: data/event_kubric/train
event_kubric_root: data/event_kubric
split_seed: 1234
event_kubric_rgb_variant: sharp
event_kubric_eval_points: 128
samples_per_epoch: 9024
num_workers: 8
val_num_workers: 4
logging_backend: tensorboard
eval_every_epochs: 1
best_metric: aj
save_every: 1

frame_sampling: uniform
frame_sample_ratio: 2.0
input_size: [384, 512]
N: 192
T: 24
M: 24
D: 256
K: 16
decoder_layer_num: 3
predicton_head_layer_num: 3
rerank_layer_num: 3
vit_backbone: dinov3_s_plus
vit_pretrained_path: checkpoints/dinov3_hf/vits16plus_lvd1689m
vit_upsample_factor: 1.143
M_i: 72
delta_v: 0.8
trajectory_history_size: 8
trajectory_history_dim: 32
trajectory_history_max_bias: 0.5
trajectory_history_stages: both
train_trajectory_scorer_only: true

lambda_patch_cls: 3.0
evaluation: true
# Six GPUs: effective batch 24, 376 updates/epoch, 3,008 updates total.
# Four GPUs: effective batch 16, 564 updates/epoch, 4,512 updates total.
epoch_num: 8
lr: 0.00005
warmup_ratio: 0.05
wd: 0.00001
bs: 1
grad_accum_steps: 4
grad_checkpoint: true
amp: true
seed: 1234
