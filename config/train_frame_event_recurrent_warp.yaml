# TAPFormer-style recurrent_warp frontend with pretrained ETAP.
# Fast totals 20%; panning totals 40%; batch and sequential motion each total 50%.
event_kubric_root: data/event_kubric
event_kubric_sources:
  - {name: train_batch, weight: 24, val_fraction: 0.1}
  - {name: train_seq, weight: 24, val_fraction: 0.1}
  - {name: train_batch_panning, weight: 16, val_fraction: 0.1}
  - {name: train_seq_panning, weight: 16, val_fraction: 0.1}
  - {name: fast_batch, weight: 6, val_fraction: 0.1}
  - {name: fast_seq, weight: 6, val_fraction: 0.1}
  - {name: fast_batch_panning, weight: 4, val_fraction: 0.1}
  - {name: fast_seq_panning, weight: 4, val_fraction: 0.1}
split_seed: 1234
samples_per_epoch: 9024
checkpoint_path: null  # Random tracker; DINOv3 remains pretrained and frozen.
train_event_only: false
output_dir: outputs/frame_event_recurrent_warp

input_size: [384, 512]
T: 24
N: 192
val_points: 128
frame_interval: 4
# Training samples across the full sequence, starting at actual RGB anchors.
# Validation does the same with fixed per-sequence randomness; 0 restores prefix clips.
eval_start: null
bs: 1
num_workers: 8
val_num_workers: 4

M: 24
D: 256
K: 16
decoder_layer_num: 3
predicton_head_layer_num: 3
rerank_layer_num: 3
vit_backbone: dinov3_s_plus
vit_pretrained_path: checkpoints/dinov3_hf/vits16plus_lvd1689m
vit_upsample_factor: 1.143
grad_checkpoint: true
event_channels: 10
event_fusion_type: recurrent_warp
event_motion_dim: 64
event_encoder: etap
event_pretrained_path: checkpoints/ETAP_v1_cvpr25.pth

lambda_patch_cls: 3.0
delta_v: 0.8
# 6 GPUs x batch 1 x accumulation 4 = effective batch 24.
# 9,024 samples / 24 = 376 updates per epoch; 96 epochs = 36,096 updates.
epoch_num: 96
grad_accum_steps: 4
warmup_ratio: 0.01  # 90 successful updates, followed by cosine decay.
save_every: 10
overfit_steps: 100
log_every: 20
lr: 0.0005
wd: 0.00001
amp: true
seed: 1234
